<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruise Ducky</title>
    <style>
        /* I Don't Like This — Paper & Ink Theme (Extracted) */
        :root {
          --bg:           #f4f1ea;
          --bg-2:         #ede9df;
          --surface:      #faf8f3;
          --surface-2:    rgba(22, 19, 15, 0.05);
          --border:       #16130f;
          --border-soft:  rgba(22, 19, 15, 0.16);
          --accent:       #d63c22;
          --accent-2:     #b5321c;
          --accent-glow:  rgba(214, 60, 34, 0.15);
          --text:         #16130f;
          --text-muted:   #6b655a;
          --white:        #faf8f3;
          --radius:       2px;
          --radius-lg:    4px;
          --shadow:       4px 4px 0 var(--border);
          --shadow-sm:    3px 3px 0 var(--border);
          --header-h:     72px;
          --banner-h:     0px;
          --transition:   0.18s cubic-bezier(0.3, 0.7, 0.4, 1);
          --font-display: 'Instrument Serif', Georgia, serif;
          --font-body:    'Space Grotesk', 'Helvetica Neue', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          font-family: var(--font-body);
          background: var(--bg);
          color: var(--text);
          line-height: 1.6;
          padding-top: 72px;
        }

        .site-header {
          width: 100%;
          height: 72px;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          z-index: 100;
          background: var(--bg);
          border-bottom: 1px solid var(--border);
        }
        .header-inner {
          max-width: 1280px;
          margin: 0 auto;
          height: 100%;
          padding: 0 2.5rem;
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          align-items: center;
        }
        .header-left {
          display: flex;
          align-items: center;
        }
        .header-right {
          display: flex;
          align-items: center;
          justify-content: flex-end;
        }
        .logo {
          font-family: var(--font-display);
          font-size: 1.45rem;
          font-style: italic;
          font-weight: 400;
          justify-self: center;
        }

        .back-link {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            transition: all var(--transition);
        }
        .back-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            .header-inner { padding: 0 1rem; }
            .back-link { font-size: 0.7rem; padding: 0.3rem 0.6rem; }
            .logo { font-size: 1.2rem; }
        }

        .hero {
          min-height: calc(100vh - 72px);
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 0 2rem;
        }
        .hero-content { max-width: 800px; }
        .hero-kicker {
          display: inline-block;
          font-size: 0.75rem;
          font-weight: 600;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--text-muted);
          border: 1px solid var(--border-soft);
          border-radius: 999px;
          padding: 0.45rem 1.1rem;
          margin-bottom: 2.2rem;
        }
        h1 {
          font-family: var(--font-display);
          font-size: clamp(3rem, 8vw, 6rem);
          line-height: 1;
          margin-bottom: 1.5rem;
        }
        .subtitle {
          font-size: 1.2rem;
          color: var(--text-muted);
          margin-bottom: 2.5rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="header-left"></div>
            <div class="logo">Cruise Ducky</div>
            <div class="header-right">
                <a href="index.html" class="back-link">Visit home</a>
            </div>
        </div>
    </header>
    <main class="hero">
        <div class="hero-content">
            <span class="hero-kicker">New adventure!</span>
            <h1>Cruise Ducky</h1>
            <p class="subtitle">Wow! You've found a rubber ducky by Idontlikethis!!! 🦆</p>
        </div>
    </main>
</body>
</html>
