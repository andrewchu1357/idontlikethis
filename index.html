<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Christmas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05071a; overflow: hidden; }
    iframe {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; opacity: 0; pointer-events: none;
    }
    iframe.on { opacity: 1; pointer-events: auto; }
    noscript a { color: #ffd447; font: 16px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <iframe id="frame-a" title="Pixel animation"></iframe>
  <iframe id="frame-b" title="Pixel animation"></iframe>
  <noscript>
    <a href="Pixel%20Christmas%20(standalone).html">Pixel Christmas</a><br>
    <a href="Pixel%20North%20Pole%20(standalone).html">Pixel North Pole</a><br>
    <a href="Pixel%20Sleigh%20Ride%20(standalone).html">Pixel Sleigh Ride</a><br>
    <a href="Pixel%20Gingerbread%20(standalone).html">Pixel Gingerbread</a><br>
    <a href="Pixel%20Skating%20Pond%20(standalone).html">Pixel Skating Pond</a><br>
    <a href="Pixel%20Carolers%20(standalone).html">Pixel Carolers</a><br>
    <a href="Pixel%20Rooftop%20(standalone).html">Pixel Rooftop</a><br>
    <a href="Pixel%20Holiday%20Train%20(standalone).html">Pixel Holiday Train</a>
  </noscript>

  <script>
  (function () {
    'use strict';

    // To add an animation, drop its standalone .html next to this file and
    // list it here. `dur` (seconds per cycle) is only a fallback; the real
    // length is read from the page once it loads.
    var SCENES = [
      { src: 'Pixel Christmas (standalone).html',   dur: 32.5 },
      { src: 'Pixel North Pole (standalone).html',  dur: 34.5 },
      { src: 'Pixel Sleigh Ride (standalone).html', dur: 31 },
      { src: 'Pixel Gingerbread (standalone).html', dur: 34.5 },
      { src: 'Pixel Skating Pond (standalone).html', dur: 33.5 },
      { src: 'Pixel Carolers (standalone).html',    dur: 32 },
      { src: 'Pixel Rooftop (standalone).html',     dur: 34.5 },
      { src: 'Pixel Holiday Train (standalone).html', dur: 34 }
    ];

    var PRELOAD_LEAD = 10;      // start loading the next page this many seconds before the switch
    var READY_TIMEOUT = 30000;  // give up waiting on a page after this long (ms)
    var PLAYHEAD_KEY = 'animstage-v3:t';  // the pages share this saved-playhead key
    var STAGE_SEL = 'svg[data-om-exportable-video-with-duration-secs]';

    var frames = [document.getElementById('frame-a'), document.getElementById('frame-b')];

    function pick(exclude) {
      if (SCENES.length < 2) return 0;
      var i;
      do { i = Math.floor(Math.random() * SCENES.length); } while (i === exclude);
      return i;
    }

    // Accumulate time from requestAnimationFrame, the same clock the pages
    // animate on, so the two stay in step even if the tab is backgrounded.
    function wait(seconds) {
      return new Promise(function (resolve) {
        var last = null, acc = 0;
        function step(ts) {
          if (last !== null) acc += (ts - last) / 1000;
          last = ts;
          if (acc >= seconds) resolve(); else requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }

    // The animation stage inside a frame: an element, null (not rendered
    // yet) or false (unreachable, e.g. when opened straight from disk).
    function stageOf(frame, staleDoc) {
      var doc;
      try { doc = frame.contentDocument; } catch (e) { return false; }
      if (!doc) return false;
      if (doc === staleDoc) return null;
      return doc.querySelector(STAGE_SEL);
    }

    // Hide the page's own playback bar (play/pause, scrubber, download).
    function hideControls(frame) {
      var doc = frame.contentDocument;
      if (!doc || doc.getElementById('host-hide-controls')) return;
      var st = doc.createElement('style');
      st.id = 'host-hide-controls';
      st.textContent = '[data-omelette-chrome]{display:none!important}';
      (doc.head || doc.documentElement).appendChild(st);
    }

    // Pause the page's animation on time t (seconds).
    function seek(frame, t) {
      var s = stageOf(frame), w = frame.contentWindow;
      if (!s || !w) return;
      s.dispatchEvent(new w.CustomEvent('data-om-seek-to-time-frame', { detail: { time: t } }));
    }

    // Resume the page's own clock (its Space shortcut toggles play/pause;
    // it is always paused right after a seek).
    function play(frame) {
      var w = frame.contentWindow;
      if (w) w.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'Space', key: ' ' }));
    }

    // Load scene idx into frame and park it on its first frame (empty sky).
    function prepare(frame, idx) {
      var staleDoc = null;
      try { staleDoc = frame.contentDocument; } catch (e) {}
      try { localStorage.removeItem(PLAYHEAD_KEY); } catch (e) {}
      frame.src = encodeURI(SCENES[idx].src);
      var t0 = Date.now();
      return new Promise(function (resolve) {
        (function poll() {
          var s = stageOf(frame, staleDoc);
          if (s) {
            hideControls(frame);
            // Give React a moment to attach its listeners before seeking.
            setTimeout(function () {
              seek(frame, 0);
              var d = parseFloat(s.getAttribute('data-om-exportable-video-with-duration-secs'));
              resolve({ frame: frame, dur: d > 0 ? d : SCENES[idx].dur, controlled: true });
            }, 300);
          } else if (s === false || Date.now() - t0 > READY_TIMEOUT) {
            // Can't drive this page; let it play on its own and switch on a timer.
            resolve({ frame: frame, dur: SCENES[idx].dur, controlled: false });
          } else {
            setTimeout(poll, 100);
          }
        })();
      });
    }

    function show(scene) {
      if (scene.controlled) { seek(scene.frame, 0); play(scene.frame); }
      scene.frame.classList.add('on');
    }

    function retire(frame) {
      frame.classList.remove('on');
      frame.src = 'about:blank';
    }

    async function run() {
      var idx = pick(-1);
      var cur = await prepare(frames[0], idx);
      show(cur);

      for (;;) {
        var nextIdx = pick(idx);
        var back = cur.frame === frames[0] ? frames[1] : frames[0];
        var pending;

        if (cur.controlled) {
          await wait(Math.max(0, cur.dur - PRELOAD_LEAD));
          pending = prepare(back, nextIdx);
          await wait(Math.min(PRELOAD_LEAD, cur.dur));
          // Every cycle ends on the empty sky the next one starts from:
          // hold there until the next page is ready.
          seek(cur.frame, cur.dur);
        } else {
          await wait(cur.dur);
          pending = prepare(back, nextIdx);
        }

        var next = await pending;
        show(next);
        retire(cur.frame);
        cur = next;
        idx = nextIdx;
      }
    }

    run();
  })();
  </script>
</body>
</html>
